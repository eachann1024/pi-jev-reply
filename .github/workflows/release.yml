name: Release on push

# 推到 main 且插件源码或发布文件有变化时，自动发布到 npm（Pi 插件市场按 pi-package 关键字从 npm 收录）。
# 只改文档或 CI 的提交不在 paths 里，不会触发。
# 版本号：package.json 比 npm 最新版高（手动升过）就用它；否则在 npm 最新版上补丁号 +1，发布后提交回 main。
# 回写提交由 GITHUB_TOKEN 推送并带 [skip ci]，GitHub 不会因此再触发工作流，不会循环。
on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'lib/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11 --registry=https://registry.npmjs.org
      - name: Choose version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const parse = v => /^\d+\.\d+\.\d+$/.test(v ?? '') ? v.split('.').map(Number) : null;
          const cmp = (a, b) => { const x = parse(a), y = parse(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
          if (!parse(pkg.version)) throw new Error(`package.json version must be X.Y.Z: ${pkg.version}`);
          const res = await fetch(`https://registry.npmjs.org/${pkg.name.replace('/', '%2F')}`, { headers: { 'cache-control': 'no-cache' } });
          if (!res.ok && res.status !== 404) throw new Error(`npm registry HTTP ${res.status}`);
          const meta = res.status === 404 ? { versions: {} } : await res.json();
          const published = Object.keys(meta.versions ?? {}).filter(parse);
          const highest = published.sort(cmp).at(-1);
          let version = pkg.version, bumped = false;
          if (highest && cmp(pkg.version, highest) <= 0) {
            const [major, minor, patch] = parse(highest);
            version = `${major}.${minor}.${patch + 1}`;
            bumped = true;
          }
          if (published.includes(version)) throw new Error(`${pkg.name}@${version} is already on npm`);
          console.log(`${pkg.name}: package.json ${pkg.version}, npm highest ${highest ?? 'none'} -> publish ${version}${bumped ? ' (auto patch bump)' : ''}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nbumped=${bumped}\nname=${pkg.name}\n`);
          NODE
      - name: Prepare release commit
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ steps.version.outputs.bumped }}" = "true" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m "chore(release): v$VERSION [skip ci]"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack the exact release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/release/*.tgz --access public
      - name: Tag the published source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # 标签固定指向打包时的提交，回写 main 时即使要 rebase，也不影响标签和附件。
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists; keep it"
          else
            git tag "v$VERSION" "$SHA"
            git push origin "refs/tags/v$VERSION"
          fi
      - name: Commit version back to main
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            if ! git pull --rebase origin main; then git rebase --abort || true; break; fi
          done
          echo "::warning::npm 已发布 $VERSION（标签已建），但版本号回写 main 失败；下次发布会在 npm 最高版上继续 +1，不会重复。"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "release v$VERSION exists"; exit 0; fi
          gh release create "v$VERSION" "$RUNNER_TEMP"/release/*.tgz --verify-tag --title "v$VERSION" --generate-notes \
            --notes "npm: \`${{ steps.version.outputs.name }}@$VERSION\` · 安装：\`pi install npm:${{ steps.version.outputs.name }}\`"
